name: Atualizar cards do README

on:
  schedule:
    - cron: "0 6 * * *"   # todo dia às 03:00 (horário de Brasília)
  workflow_dispatch:       # permite rodar na mão pela aba Actions
  push:
    branches: [main]
    paths: [".github/workflows/readme-stats.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Card de estatísticas
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight&hide_border=true&locale=pt-br
          path: profile/stats.svg
          token: ${{ secrets.PAT }}

      - name: Card de linguagens
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&theme=tokyonight&hide_border=true&locale=pt-br
          path: profile/top-langs.svg
          token: ${{ secrets.PAT }}

      - name: Card do repositório Estudos
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=Estudos&theme=tokyonight&hide_border=true&locale=pt-br
          path: profile/pin-estudos.svg
          token: ${{ secrets.PAT }}

      - name: Salvar os cards no repositório
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: atualiza cards do README" || exit 0
          git push
